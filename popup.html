<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font: 13px/1.5 -apple-system, sans-serif; padding: 12px; background: #1a1a2e; color: #e0e0e0; }
    h1 { font-size: 15px; color: #ff6b35; margin-bottom: 8px; }
    .status { padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
    .status.ok { background: #1b3a2d; color: #4ade80; }
    .status.err { background: #3a1b1b; color: #f87171; }
    button { display: block; width: 100%; padding: 8px; margin: 4px 0; background: #ff6b35; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #e55a2b; }
    pre { background: #0d0d1a; padding: 8px; border-radius: 4px; font-size: 11px; max-height: 300px; overflow: auto; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
    .info { font-size: 11px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🔍 Ahrefs Extractor</h1>
  <div id="status" class="status">Checking...</div>
  <button id="btnExtract">Extract All Data</button>
  <button id="btnTables">Extract Tables Only</button>
  <button id="btnCopy">Copy Last Result</button>
  <pre id="output"></pre>
  <div class="info">Bridge: http://127.0.0.1:18800/extract</div>
  <script src="popup.js"></script>
</body>
</html>
